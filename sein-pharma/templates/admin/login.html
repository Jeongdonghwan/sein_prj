<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>관리자 로그인 | 세인약품</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/symbol.png') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-logo">
    <img class="word" src="{{ url_for('static', filename='img/logo-white.png') }}" alt="(주) 세인약품">
    <small>ADMIN LOGIN</small>
  </div>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}
      <div class="flash {{ cat }}">{{ m }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="fi"><input type="text" name="username" placeholder="아이디" required autofocus autocomplete="username"></div>
    <div class="fi"><input type="password" name="password" placeholder="비밀번호" required autocomplete="current-password"></div>
    <button type="submit" class="btn-gold btn-block">로그인</button>
  </form>
</div>
</body>
</html>
